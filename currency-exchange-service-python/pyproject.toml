[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "currency-exchange-service-python"
version = "1.0.0"
description = "Currency Exchange Service"
requires-python = ">=3.10"
# Completely versionless! Versions are governed centrally by the root workspace
dependencies = [
    "Flask",
    "python-json-logger",
    "boto3",
    "pytest",
    "gunicorn",
    "waitress",
    "requests",
]
