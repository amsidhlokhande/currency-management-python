[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-core-python"
version = "1.0.0"
description = "Internal Shared Enterprise Core Library for Python Microservices (Logging, Actuators, Errors, Interceptors, Swagger)"
authors = [
    { name = "Enterprise Architecture Team", email = "architecture@enterprise.internal" }
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: Flask",
]
dependencies = [
    "Flask>=3.0.0",
    "werkzeug>=3.0.0",
    "python-json-logger>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "requests>=2.30.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["enterprise_core*"]
