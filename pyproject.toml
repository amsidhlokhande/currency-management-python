[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "currency-management-workspace"
version = "1.0.0"
description = "Enterprise Multi-Service Python Monorepo Workspace governed by uv"
requires-python = ">=3.10"
dependencies = []

[tool.uv.workspace]
members = [
    "currency-exchange-service-python",
    "currency-conversion-service-python",
]

# Centralized Dependency Version Overrides / Constraints (The uv BOM)
# All microservices in this workspace resolve to these exact pinned versions
# regardless of what their individual specifications require.
[tool.uv]
override-dependencies = [
    "Flask==3.1.0",
    "werkzeug==3.1.3",
    "python-json-logger==2.0.7",
    "requests==2.32.3",
    "urllib3==2.2.3",
    "gunicorn==23.0.0",
    "waitress==3.0.1",
    "pytest==8.3.3",
    "boto3==1.35.40",
    "certifi==2024.8.30",
    "idna==3.10",
    "charset-normalizer==3.4.0",
]
