name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      core_library_version:
        description: 'Enterprise Core Library Tag or Branch (e.g. v1.2.0 or leave blank for default main)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout Microservice Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 1: Optional Docker Hub Login (if secrets exist)
      - name: Log in to Docker Registry
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      # Step 2: Resolve Enterprise Core Library Version (Tag or Main)
      - name: Resolve Enterprise Core Version
        id: core_repo
        run: |
          VERSION="${{ inputs.core_library_version || vars.ENTERPRISE_CORE_VERSION || '' }}"
          if [ -n "$VERSION" ]; then
            echo "repo_url=https://github.com/amsidhlokhande/enterprise-core-python.git@${VERSION}" >> $GITHUB_OUTPUT
            echo "tag_suffix=${VERSION}" >> $GITHUB_OUTPUT
            echo "Using pinned enterprise-core-python version: ${VERSION}"
          else
            echo "repo_url=https://github.com/amsidhlokhande/enterprise-core-python.git" >> $GITHUB_OUTPUT
            echo "Using default enterprise-core-python (main branch)"
          fi

      # Step 3: Build & Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
          tags: |
            ${{ env.DOCKER_USERNAME || 'local' }}/${{ github.event.repository.name || 'currency-conversion-service-python' }}:latest
            ${{ steps.core_repo.outputs.tag_suffix != '' && format('{0}/{1}:{2}', env.DOCKER_USERNAME || 'local', github.event.repository.name || 'currency-conversion-service-python', steps.core_repo.outputs.tag_suffix) || '' }}
          build-args: |
            GITHUB_TOKEN=${{ secrets.READ_PACKAGES_TOKEN }}
            ENTERPRISE_CORE_REPO=${{ steps.core_repo.outputs.repo_url }}
