apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: currency-conversion-service-python
  namespace: "currency-microservices-prod"
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/description: "Public Currency Conversion Calculation API with Context Path"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "false"
    spec:
      serviceAccountName: sa-currency-conversion@currency-microservices-prod.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: us-central1-docker.pkg.dev/currency-microservices-prod/currency-repo/currency-conversion-service-python:latest
        ports:
        - name: http1
          containerPort: 8100
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /currency-conversion-service-python/health/liveness
            port: 8100
          initialDelaySeconds: 5
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /currency-conversion-service-python/health/readiness
            port: 8100
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 10
        env:
        - name: PORT
          value: "8100"
        - name: ENV
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: CONTEXT_PATH
          value: "/currency-conversion-service-python"
        - name: EXCHANGE_SERVICE_URL
          value: "https://currency-exchange-service-python-internal-uc.a.run.app/currency-exchange-service-python"
        - name: GCP_OIDC_AUTH
          value: "true"
